name: Build Windows Fast

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: amigos-do-rich-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Validate source
        run: |
          npm run check
          npm test

      - name: Prepare automatic login credentials
        shell: pwsh
        env:
          PANEL_AUTO_LOGIN_EMAIL: ${{ secrets.PANEL_AUTO_LOGIN_EMAIL }}
          PANEL_AUTO_LOGIN_PASSWORD: ${{ secrets.PANEL_AUTO_LOGIN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PANEL_AUTO_LOGIN_EMAIL)) {
            throw "Configure o secret PANEL_AUTO_LOGIN_EMAIL no repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:PANEL_AUTO_LOGIN_PASSWORD)) {
            throw "Configure o secret PANEL_AUTO_LOGIN_PASSWORD no repositório."
          }
          $payload = @{
            email = $env:PANEL_AUTO_LOGIN_EMAIL
            password = $env:PANEL_AUTO_LOGIN_PASSWORD
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD ".auto-login.json"),
            $payload,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build extracted Windows app
        run: npm run dist:win

      - name: Package fast-start ZIP
        shell: pwsh
        run: |
          $appDir = Join-Path $PWD "dist\win-unpacked"
          $exe = Join-Path $appDir "Ferramentas Amigos do Rich.exe"
          $zip = Join-Path $PWD "dist\FerramentasAmigosDoRich-win-x64.zip"
          if (-not (Test-Path $exe)) {
            throw "O executável extraído não foi gerado em $exe"
          }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $appDir "*") -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1MB) {
            throw "O pacote ZIP gerado parece inválido."
          }

      - name: Remove temporary credentials file
        if: always()
        shell: pwsh
        run: Remove-Item -Force .auto-login.json -ErrorAction SilentlyContinue

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ferramentas-Amigos-do-Rich-Windows
          path: dist/FerramentasAmigosDoRich-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          $asset = "dist/FerramentasAmigosDoRich-win-x64.zip"
          $title = "Ferramentas Amigos do Rich - Windows"
          $notes = "Versão de abertura rápida atualizada automaticamente a partir do commit $env:GITHUB_SHA. O ZIP é extraído somente na primeira execução."

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar o pacote da Release." }
            gh release delete-asset $tag "AmigosUnidos-portable.exe" --yes --repo $env:GITHUB_REPOSITORY *> $null
            gh release edit $tag --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar os metadados da Release." }
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar a Release do Windows." }
          }
